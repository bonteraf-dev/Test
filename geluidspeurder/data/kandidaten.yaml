# Kandidaat-geluiden voor 'Het Geluid'.
#
# naam  : Nederlandse omschrijving (zo specifiek mogelijk, zoals je hem zou inzenden)
# cat   : categorie (voor hints als "het komt uit de keuken")
# en    : Engelse beschrijvingen voor het AI-model (CLAP is in het Engels getraind)
# k     : verwachte akoestische eigenschappen (zie geluidspeurder/features.py -> KENMERKEN)
# alias : andere woorden waarmee mensen hetzelfde geluid raden (voor 'al fout geraden')
#
# Voeg gerust eigen kandidaten toe of maak een eigen bestand en gebruik --kandidaten.

